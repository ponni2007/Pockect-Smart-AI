{% extends "base.html" %}{% block content %}<div class="form-card"><h1>💎 Jewelry Budget Planner</h1><p>Upload an outfit image optionally for multimodal recommendations.</p><form id="jewelryForm"><div class="field"><label>Budget (₹)</label><input type="number" name="budget" min="1" required></div><div class="field"><label>Occasion</label><select name="occasion"><option>Wedding</option><option>Birthday</option><option>Festival</option><option>Party</option><option>Engagement</option></select></div><div class="field"><label>Style</label><select name="style"><option>Traditional</option><option>Modern</option><option>Elegant</option><option>Minimalist</option></select></div><div class="field"><label>Outfit Colour</label><input name="color" placeholder="e.g. blue, maroon, black"></div><div class="field"><label>Outfit Image (optional)</label><input type="file" name="image" accept="image/*"></div><button class="btn">Generate Jewelry Plan</button></form></div><div id="result" class="result" style="margin-top:25px"></div>
<script>document.getElementById("jewelryForm").addEventListener("submit",async e=>{e.preventDefault();const r=await fetch("/generate-jewelry",{method:"POST",body:new FormData(e.target)});showResult(await r.json())})</script>{% endblock %}
