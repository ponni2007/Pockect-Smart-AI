{% extends "base.html" %}{% block content %}<div class="form-card"><h1>🏠 Home Interior Planner</h1><p>Enter your budget and preferences.</p>
<form id="homeForm"><div class="field"><label>Total Budget (₹)</label><input type="number" name="budget" min="1" required></div><div class="field"><label>Room Type</label><select name="room_type"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option></select></div><div class="field"><label>Style</label><select name="style"><option>Modern</option><option>Minimalist</option><option>Traditional</option><option>Luxury</option></select></div><div class="field"><label>Required Items</label><input name="items" value="lights, ceiling fan, table"></div><button class="btn">Generate Recommendations</button></form></div><div id="result" class="result" style="margin-top:25px"></div>
<script>document.getElementById("homeForm").addEventListener("submit",async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.budget=Number(d.budget);const r=await fetch("/generate-home",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});showResult(await r.json())})</script>{% endblock %}
