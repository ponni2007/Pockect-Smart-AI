{% extends "base.html" %}{% block content %}<div class="form-card"><h1>🎉 Party Budget Planner</h1><form id="partyForm"><div class="field"><label>Total Budget (₹)</label><input type="number" name="budget" min="1" required></div><div class="field"><label>Guest Count</label><input type="number" name="guests" min="1" required></div><div class="field"><label>Event Type</label><select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Family Function</option></select></div><div class="field"><label>Venue Details</label><input name="venue" placeholder="Home / Hall / Outdoor"></div><button class="btn">Generate Party Plan</button></form></div><div id="result" class="result" style="margin-top:25px"></div>
<script>document.getElementById("partyForm").addEventListener("submit",async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));d.budget=Number(d.budget);d.guests=Number(d.guests);const r=await fetch("/generate-party",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});showResult(await r.json())})</script>{% endblock %}
